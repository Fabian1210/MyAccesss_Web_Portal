<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Welcome - MyAccess Web Portal</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body>
<header th:replace="~{fragments/navbar :: mainNav}"></header>

<div class="container mt-5">
    <div class="text-center">
        <h1 class="mb-3">Welcome to MyAccess Web Portal</h1>
        <p class="lead mb-4">
            Please sign in to access your dashboard, departments, and projects.
        </p>

        <a class="btn btn-primary btn-lg me-2" href="/login">Sign In</a>

        <div class="mt-4 text-muted">
            <small>Contact your administrator if you need an account or access.</small>
        </div>
    </div>
</div>

</body>
</html>
