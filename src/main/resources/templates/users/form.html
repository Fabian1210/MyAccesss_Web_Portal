<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${editing} ? 'Edit User' : 'New User'">User Form</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body>
<header th:replace="~{fragments/navbar :: mainNav}"></header>

<div class="container mt-4">
    <h1 class="mb-4" th:text="${editing} ? 'Edit User' : 'Create New User'">User</h1>

    <form th:action="${editing} ? @{/admin/users/{id}(id=${userId})} : @{/admin/users}"
          th:object="${userForm}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <!-- EMAIL -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"></div>
        </div>

        <!-- PASSWORD -->
        <div class="mb-3">
            <label class="form-label">
                Password
                <small class="text-muted" th:if="${editing}">
                    (leave blank to keep current)
                </small>
            </label>
            <input type="password" th:field="*{password}" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}"></div>
        </div>

        <!-- ROLE -->
        <div class="mb-3">
            <label class="form-label">Role</label>
            <select th:field="*{role}" class="form-select">
                <option value="">-- Select Role --</option>
                <option value="ADMIN">Admin</option>
                <option value="MANAGER">Manager</option>
                <option value="EMPLOYEE">Employee</option>
            </select>
            <div class="text-danger"
                 th:if="${#fields.hasErrors('role')}"
                 th:errors="*{role}"></div>
        </div>

        <!-- ENABLED -->
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{enabled}" id="enabledCheck">
            <label class="form-check-label" for="enabledCheck">
                Enabled
            </label>
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${editing} ? 'Update' : 'Create'">
            Save
        </button>
        <a th:href="@{/admin/users}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>

</body>
</html>
