<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="${editing} ? 'Edit User - MyAccess Web Portal' : 'Create User - MyAccess Web Portal'">
        User - MyAccess Web Portal
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>

<body>
<header th:replace="~{fragments/navbar :: mainNav}"></header>

<main class="container mt-4">

    <h1 class="mb-4"
        th:text="${editing} ? 'Edit User' : 'Create New User'">
        Create New User
    </h1>

    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
        <p th:each="err : ${#fields.globalErrors()}"
           th:text="${err}">Error</p>
    </div>

    <form th:if="${!editing}"
          th:action="@{/admin/users}"
          th:object="${userForm}"
          method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Role</label>
            <select th:field="*{role}" class="form-select">
                <option value="">-- Select Role --</option>
                <option value="ADMIN">Admin</option>
                <option value="MANAGER">Manager</option>
                <option value="EMPLOYEE">Employee</option>
            </select>
            <div class="text-danger"
                 th:if="${#fields.hasErrors('role')}"
                 th:errors="*{role}">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Create</button>
        <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
    </form>
    >
    <form th:if="${editing}"
          th:action="@{/admin/users/{id}(id=${userId})}"
          th:object="${userForm}"
          method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>
        </div>
        >
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Role</label>
            <select th:field="*{role}" class="form-select">
                <option value="">-- Select Role --</option>
                <option value="ADMIN">Admin</option>
                <option value="MANAGER">Manager</option>
                <option value="EMPLOYEE">Employee</option>
            </select>
            <div class="text-danger"
                 th:if="${#fields.hasErrors('role')}"
                 th:errors="*{role}">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
