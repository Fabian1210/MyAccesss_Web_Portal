<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>User Management - MyAccess Web Portal</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body>
<header th:replace="~{fragments/navbar :: mainNav}"></header>

<div class="container mt-4">

    <h1 class="mb-3">User Management</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form class="row g-2 mb-3" th:action="@{/admin/users}" method="get">
        <div class="col-auto">
            <input type="text" name="q" class="form-control"
                   placeholder="Search by email"
                   th:value="${searchQuery}">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">Search</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-primary" th:href="@{/admin/users/new}">New User</a>
        </div>
    </form>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Created At</th>
            <th style="width: 160px;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.email}">user@example.com</td>
            <td th:text="${u.roleLabel}">Admin</td>
            <td>
                <span th:text="${u.enabled} ? 'Enabled' : 'Disabled'">Enabled</span>
            </td>
            <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 12:00</td>
            <td>
                <a class="btn btn-sm btn-outline-secondary me-1"
                   th:href="@{/admin/users/{id}/edit(id=${u.id})}">
                    Edit
                </a>

                <form th:action="@{/admin/users/{id}/delete(id=${u.id})}"
                      method="post"
                      class="d-inline">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Delete this user?');">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="6" class="text-center text-muted">No users found.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
