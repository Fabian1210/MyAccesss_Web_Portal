<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Users - MyAccess Web Portal</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body>
<header th:replace="~{fragments/navbar :: mainNav}"></header>
    <div class="container-fluid">
        <a class="navbar-brand" href="/">MyAccess Web Portal</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/users">Users</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Users</h1>
        <a href="/users/new" class="btn btn-primary">New User</a>
    </div>

    <form class="mb-3" method="get" action="/users">
        <div class="input-group">
            <input type="text" class="form-control" name="q"
                   placeholder="Search by email"
                   th:value="${query}">
            <button class="btn btn-outline-secondary" type="submit">Search</button>
        </div>
    </form>

    <p>
        <a th:href="@{/admin/users/report}">View user report</a>
    </p>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Type</th>
            <th>Enabled</th>
            <th>Created At</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.email}">email@example.com</td>
            <td th:text="${u.roleLabel}">Admin</td>
            <td th:text="${u.enabled}">true</td>
            <td th:text="${u.createdAt}">2025-11-21T00:00</td>
            <td>
                <a th:href="@{'/users/' + ${u.id} + '/edit'}"
                   class="btn btn-sm btn-secondary">Edit</a>

                <form th:action="@{'/users/' + ${u.id} + '/delete'}"
                      method="post"
                      style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure you want to delete this user?');">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
