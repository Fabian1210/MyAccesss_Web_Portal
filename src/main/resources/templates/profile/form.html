<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Profile - MyAccess Web Portal</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body>
<header th:replace="~{fragments/navbar :: mainNav}"></header>

<div class="container mt-4">
    <h1 class="mb-3">My Profile</h1>

    <div th:if="${successMessage}" class="alert alert-success"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger"
         th:text="${errorMessage}"></div>

    <p class="text-muted mb-4">
        Current role:
        <strong th:text="${currentRole}">User</strong>
    </p>

    <form th:action="@{/profile}"
          th:object="${profileForm}"
          method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <!-- EMAIL -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"></div>
        </div>

        <!-- PASSWORD -->
        <div class="mb-3">
            <label class="form-label">
                New Password
                <small class="text-muted">(leave blank to keep current)</small>
            </label>
            <input type="password" th:field="*{password}" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a th:href="@{/}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
</body>
</html>
