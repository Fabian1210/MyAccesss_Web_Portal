<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>New Department - MyAccess Web Portal</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body>

<header th:replace="~{fragments/navbar :: mainNav}"></header>

<div class="container mt-4">
    <h1 class="mb-4">Create Department</h1>

    <form th:action="@{/admin/departments}"
          th:object="${departmentForm}"
          method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Create</button>
        <a th:href="@{/admin/departments}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

</body>
</html>
