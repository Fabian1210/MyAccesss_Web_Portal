<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Departments - MyAccess Web Portal</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body>

<!-- Shared navbar -->
<header th:replace="~{fragments/navbar :: mainNav}"></header>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Departments</h1>
        <a th:href="@{/admin/departments/new}" class="btn btn-primary">New Department</a>
    </div>

    <form class="mb-3" th:action="@{/admin/departments}" method="get">
        <div class="input-group">
            <input type="text"
                   class="form-control"
                   name="q"
                   placeholder="Search by name"
                   th:value="${query}">
            <button class="btn btn-outline-secondary" type="submit">Search</button>
        </div>
    </form>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th style="width: 200px;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${departments}">
            <td th:text="${d.id}">1</td>
            <td th:text="${d.name}">Engineering</td>
            <td>
                <a th:href="@{/admin/departments/{id}/edit(id=${d.id})}"
                   class="btn btn-sm btn-secondary">Edit</a>

                <form th:action="@{/admin/departments/{id}/delete(id=${d.id})}"
                      method="post"
                      style="display:inline;">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Delete this department?');">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
