<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Departments - MyAccess Web Portal</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">MyAccess Web Portal</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/users">Users</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/departments">Departments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/reports/users">Reports</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Departments</h1>
        <a href="/departments/new" class="btn btn-primary">New Department</a>
    </div>

    <form class="mb-3" method="get" action="/departments">
        <div class="input-group">
            <input type="text" class="form-control" name="q"
                   placeholder="Search by name"
                   th:value="${query}">
            <button class="btn btn-outline-secondary" type="submit">Search</button>
        </div>
    </form>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${departments}">
            <td th:text="${d.id}">1</td>
            <td th:text="${d.name}">Engineering</td>
            <td>
                <a th:href="@{'/departments/' + ${d.id} + '/edit'}"
                   class="btn btn-sm btn-secondary">Edit</a>

                <form th:action="@{'/departments/' + ${d.id} + '/delete'}"
                      method="post"
                      style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Delete this department?');">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
