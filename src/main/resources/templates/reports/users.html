<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>User Report - MyAccess Web Portal</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body>
<header th:replace="~{fragments/navbar :: mainNav}"></header>

<div class="container mt-4">
    <h1 th:text="${reportTitle}">User Accounts Report</h1>
    <p class="text-muted">
        Generated at
        <span th:text="${#temporals.format(generatedAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 12:00</span>
    </p>

    <table class="table table-bordered table-sm">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Role</th>
            <th>Enabled</th>
            <th>Created At</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.email}">user@example.com</td>
            <td th:text="${u.roleLabel}">Admin</td>
            <td th:text="${u.enabled} ? 'Yes' : 'No'">Yes</td>
            <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 12:00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="5" class="text-center text-muted">No users found.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
