spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/myaccess_dev
    username: myaccess_user
    password: myaccess_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: dev

server:
  port: 8080